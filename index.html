<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marquee Sound</title>
<meta name="description" content="Marquee Sound is rebuilding its website. Find the Toronto recording studio on Instagram, Facebook and X.">
<meta name="theme-color" content="#faf5e7">
<link rel="canonical" href="https://www.marqueesound.ca/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Marquee Sound">
<meta property="og:title" content="Marquee Sound">
<meta property="og:description" content="We're rebuilding our website. In the meantime, find us on socials.">
<meta property="og:url" content="https://www.marqueesound.ca/">
<meta property="og:image" content="https://www.marqueesound.ca/logo.png">
<meta property="og:image:width" content="578">
<meta property="og:image:height" content="432">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root{
    --bg:#faf5e7;
    --ink:#424242;
    --nav:#6f6b64;
    --line:#d8d2c2;
    --nav-font:"Proxima Nova","Montserrat",Futura,"Century Gothic","Avenir Next","Segoe UI",Verdana,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Verdana,Geneva,sans-serif;
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .site{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    max-width:1100px;
    margin:0 auto;
    padding:20px;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 0;
    text-align:center;
  }
  .logo{
    display:block;
    width:347px;
    max-width:100%;
    height:auto;
  }
  .status{
    margin:42px 0 0;
    color:var(--nav);
    font-family:var(--nav-font);
    font-size:14px;
    font-weight:400;
    letter-spacing:2px;
    line-height:1.8;
    text-transform:uppercase;
  }
  footer{
    padding:0 0 12px;
    text-align:center;
  }
  .socials-label{
    margin:0 0 12px;
    color:var(--nav);
    font-size:12px;
    letter-spacing:.04em;
    line-height:1.5;
  }
  .socials{
    display:flex;
    justify-content:center;
    gap:12px;
    margin:0;
    padding:0;
    list-style:none;
  }
  .socials a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--ink);
    background:transparent;
    text-decoration:none;
    transition:background-color .18s ease,border-color .18s ease,color .18s ease;
  }
  .socials svg{
    width:15px;
    height:15px;
  }
  .socials a:hover,
  .socials a:focus-visible{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--bg);
  }
  .email{
    margin:14px 0 0;
    font-size:12px;
    line-height:1.5;
  }
  .email a{
    color:var(--nav);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
    transition:color .18s ease,border-color .18s ease;
  }
  .email a:hover,
  .email a:focus-visible{
    color:var(--ink);
    border-bottom-color:var(--ink);
  }
  .copyright{
    margin:8px 0 0;
    color:var(--nav);
    font-size:11px;
    letter-spacing:.04em;
    line-height:1.5;
  }
  a:focus-visible,
  .socials a:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:3px;
  }

  @media (max-width:600px){
    .site{padding:14px}
    main{padding:24px 0}
    .status{margin-top:32px;font-size:12px;letter-spacing:1.6px}
  }
  @media (prefers-reduced-motion:reduce){
    .socials a,
    .email a{transition:none}
  }
</style>
</head>
<body>
<div class="site">
  <main>
    <img class="logo" src="logo.png" alt="Marquee Sound" width="347" height="259">
    <p class="status">Website under construction &middot; Back soon</p>
  </main>

  <footer>
    <p class="socials-label">Find us on socials:</p>
    <ul class="socials">
      <li>
        <a href="https://www.instagram.com/marquee_sound/" target="_blank" rel="noopener noreferrer" aria-label="Marquee Sound on Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://www.facebook.com/MarqueeSoundStudio/" target="_blank" rel="noopener noreferrer" aria-label="Marquee Sound on Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M14.5 8.5V6.8c0-.8.5-1 1-1h1.7V2.6l-2.6-.1c-2.9 0-3.6 1.7-3.6 3.5v2.5H8.6V12h2.4v9.5h3.5V12h2.4l.4-3.5h-2.8z"></path>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://twitter.com/marquee_sound" target="_blank" rel="noopener noreferrer" aria-label="Marquee Sound on X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.9 2H22l-6.8 7.8L23.3 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.3L2.9 2h6.5l4.4 5.8L18.9 2zm-1.1 18h1.7L7.6 3.9H5.8L17.8 20z"></path>
          </svg>
        </a>
      </li>
    </ul>
    <p class="email"><a href="mailto:marqueesoundstudios@gmail.com">marqueesoundstudios@gmail.com</a></p>
    <p class="copyright">&copy; 2026 Marquee Sound</p>
  </footer>
</div>
</body>
</html>
